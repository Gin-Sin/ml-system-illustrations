name: Validate and publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check allocator invariants
        run: npm test
      - name: Verify published assets
        run: |
          test -s docs/assets/paged-attention.mp4
          test -s docs/assets/chapters.json
          test -s docs/assets/captions.vtt
          test -s docs/assets/poster.jpg
          test -s docs/assets/logical-block.svg
          test -s docs/assets/weighted-sum.svg
          test -s docs/assets/tail-bound.svg
          test -s docs/assets/fonts/cmu-serif-regular.woff2
          test -s docs/assets/fonts/jetbrains-mono-regular.woff2
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
